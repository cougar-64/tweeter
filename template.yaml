AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tweeter Milestone 3 follow features, user management, and story API.

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '[A-Za-z0-9_]+'

Resources:
  GetFollowersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowersLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFolloweesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFolloweesLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFollowerCountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowerCountLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFolloweeCountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFolloweeCountLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFollowingStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowingStatusLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  FollowFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: FollowLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  UnfollowFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: UnfollowLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetUserFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetUserLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  LoginFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: LoginLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  RegisterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: RegisterLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  LogoutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: LogoutLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetStoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetStoryLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  TweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      OpenApiVersion: '2.0'
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'POST,OPTIONS'"
      DefinitionBody:
        swagger: '2.0'
        info:
          title: Tweeter API
          version: '1.0'
        consumes:
          - application/json
        produces:
          - application/json
        # These cover failures generated by API Gateway before Lambda responds.
        x-amazon-apigateway-gateway-responses:
          DEFAULT_4XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          DEFAULT_5XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        paths:
          /followers/list:
            post:
              summary: Get a page of followers
              description: Returns dummy followers for the supplied user alias, page size, and optional last user.
              responses:
                '200':
                  description: A page of user DTOs and a hasMore flag.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The request is missing required fields or contains invalid values.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                # "aws" selects a custom (non-proxy) Lambda integration.
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowersFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      # Standard Lambda errors contain errorMessage; successful page responses do not.
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  # Match validation errors from GetFollowersLambda.
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
          /followees/list:
            post:
              summary: Get a page of followees
              description: Returns dummy followees for the supplied user alias, page size, and optional last user.
              responses:
                '200':
                  description: A page of user DTOs and a hasMore flag.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The request is missing required fields or contains invalid values.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweesFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /followers/count:
            post:
              summary: Get a user's follower count
              description: Returns the dummy follower count for the supplied user alias.
              responses:
                '200':
                  description: A success flag and follower count.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowerCountFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /followees/count:
            post:
              summary: Get a user's followee count
              description: Returns the dummy followee count for the supplied user alias.
              responses:
                '200':
                  description: A success flag and followee count.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweeCountFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /follow/status:
            post:
              summary: Check whether one user follows another
              description: Returns the dummy following status for the supplied follower and followee aliases.
              responses:
                '200':
                  description: A success flag and boolean isFollower result.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or either user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowingStatusFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /follow:
            post:
              summary: Follow a user
              description: Simulates following the supplied user alias using the authentication token. Does not persist a relationship in Milestone 3.
              responses:
                '200':
                  description: A success flag and optional message after the simulated operation completes.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or target user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FollowFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /unfollow:
            post:
              summary: Unfollow a user
              description: Simulates unfollowing the supplied user alias using the authentication token. Does not persist a relationship in Milestone 3.
              responses:
                '200':
                  description: A success flag and optional message after the simulated operation completes.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or target user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UnfollowFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /user/get:
            post:
              summary: Get a user by alias
              description: Looks up a dummy user by alias and returns the user DTO or null when no user exists.
              responses:
                '200':
                  description: A success flag and a user DTO, or null if the alias was not found.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUserFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /user/login:
            post:
              summary: Log in a user
              description: Returns the first dummy user and a dummy authentication token for nonempty credentials. Does not verify real credentials in Milestone 3.
              responses:
                '200':
                  description: A success flag, user DTO, and authentication token DTO.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The alias or password is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /user/register:
            post:
              summary: Register a user
              description: Validates registration fields and a Base64 image, then returns the first dummy user and a dummy token. Does not store a user or image in Milestone 3.
              responses:
                '200':
                  description: A success flag, user DTO, and authentication token DTO.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: A required registration field is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /user/logout:
            post:
              summary: Log out a user
              description: Validates the supplied token and simulates logout. Does not invalidate a stored session in Milestone 3.
              responses:
                '200':
                  description: A success flag and optional message after the simulated logout completes.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LogoutFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /story/list:
            post:
              summary: Get a page of story statuses
              description: Returns a page from the shared dummy status list using the supplied page size and optional status cursor. Alias filtering comes with real storage.
              responses:
                '200':
                  description: A page of status DTOs with nested user DTOs and a hasMore flag.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token, alias, page size, or last-item cursor is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetStoryFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

  GetStoryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetStoryFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/story/list

  LogoutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LogoutFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/user/logout

  RegisterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RegisterFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/user/register

  LoginInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LoginFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/user/login

  GetUserInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetUserFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/user/get

  UnfollowInvokePermission:
    Type: AWS::Lambda::Permission
