AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tweeter Milestone 3 follow lists, counts, and following status API.

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '[A-Za-z0-9_]+'

Resources:
  GetFollowersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowersLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFolloweesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFolloweesLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFollowerCountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowerCountLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFolloweeCountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFolloweeCountLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFollowingStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowingStatusLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  TweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      OpenApiVersion: '2.0'
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'POST,OPTIONS'"
      DefinitionBody:
        swagger: '2.0'
        info:
          title: Tweeter API
          version: '1.0'
        consumes:
          - application/json
        produces:
          - application/json
        # These cover failures generated by API Gateway before Lambda responds.
        x-amazon-apigateway-gateway-responses:
          DEFAULT_4XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          DEFAULT_5XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        paths:
          /followers/list:
            post:
              summary: Get a page of followers
              description: Returns dummy followers for the supplied user alias, page size, and optional last user.
              responses:
                '200':
                  description: A page of user DTOs and a hasMore flag.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The request is missing required fields or contains invalid values.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                # "aws" selects a custom (non-proxy) Lambda integration.
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowersFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      # Standard Lambda errors contain errorMessage; successful page responses do not.
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  # Match validation errors from GetFollowersLambda.
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
          /followees/list:
            post:
              summary: Get a page of followees
              description: Returns dummy followees for the supplied user alias, page size, and optional last user.
              responses:
                '200':
                  description: A page of user DTOs and a hasMore flag.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The request is missing required fields or contains invalid values.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweesFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /followers/count:
            post:
              summary: Get a user's follower count
              description: Returns the dummy follower count for the supplied user alias.
              responses:
                '200':
                  description: A success flag and follower count.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowerCountFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /followees/count:
            post:
              summary: Get a user's followee count
              description: Returns the dummy followee count for the supplied user alias.
              responses:
                '200':
                  description: A success flag and followee count.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweeCountFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

          /follow/status:
            post:
              summary: Check whether one user follows another
              description: Returns the dummy following status for the supplied follower and followee aliases.
              responses:
                '200':
                  description: A success flag and boolean isFollower result.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or either user alias is missing or invalid.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowingStatusFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}

  GetFollowersInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFollowersFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/followers/list

  GetFolloweesInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFolloweesFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/followees/list

  GetFollowerCountInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFollowerCountFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/followers/count

  GetFolloweeCountInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFolloweeCountFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/followees/count

  GetFollowingStatusInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFollowingStatusFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TweeterApi}/*/POST/follow/status

Outputs:
  ApiBaseUrl:
    Description: Base URL for the client communicator, including the deployed stage.
    Value: !Sub https://${TweeterApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  GetFollowersFunctionName:
    Description: Lambda function name for direct invocation and debugging.
    Value: !Ref GetFollowersFunction
  GetFolloweesFunctionName:
    Description: Followees Lambda function name for direct invocation and debugging.
    Value: !Ref GetFolloweesFunction
  GetFollowerCountFunctionName:
    Description: Follower count Lambda function name for direct invocation and debugging.
    Value: !Ref GetFollowerCountFunction
  GetFolloweeCountFunctionName:
    Description: Followee count Lambda function name for direct invocation and debugging.
    Value: !Ref GetFolloweeCountFunction
  GetFollowingStatusFunctionName:
    Description: Following status Lambda function name for direct invocation and debugging.
    Value: !Ref GetFollowingStatusFunction
