AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tweeter API and Milestone 4A persistence resources.

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '[A-Za-z0-9_]+'

  SessionInactivityMinutes:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Sliding session inactivity timeout, enforced by the server.

Globals:
  Function:
    Environment:
      Variables:
        USERS_TABLE_NAME: !Ref UsersTable
        SESSIONS_TABLE_NAME: !Ref SessionsTable
        FOLLOWS_TABLE_NAME: !Ref FollowsTable
        STORIES_TABLE_NAME: !Ref StoriesTable
        FEEDS_TABLE_NAME: !Ref FeedsTable
        PROFILE_IMAGES_BUCKET: !Ref ProfileImagesBucket
        SESSION_INACTIVITY_MINUTES: !Ref SessionInactivityMinutes

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: alias
          AttributeType: S
      KeySchema:
        - AttributeName: alias
          KeyType: HASH

  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  FollowsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: followerAlias
          AttributeType: S
        - AttributeName: followeeAlias
          AttributeType: S
      KeySchema:
        - AttributeName: followerAlias
          KeyType: HASH
        - AttributeName: followeeAlias
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: FollowersIndex
          KeySchema:
            - AttributeName: followeeAlias
              KeyType: HASH
            - AttributeName: followerAlias
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1

  StoriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: authorAlias
          AttributeType: S
        - AttributeName: postKey
          AttributeType: S
      KeySchema:
        - AttributeName: authorAlias
          KeyType: HASH
        - AttributeName: postKey
          KeyType: RANGE

  FeedsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: ownerAlias
          AttributeType: S
        - AttributeName: postKey
          AttributeType: S
      KeySchema:
        - AttributeName: ownerAlias
          KeyType: HASH
        - AttributeName: postKey
          KeyType: RANGE

  ProfileImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  ProfileImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProfileImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadProfileImages
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${ProfileImagesBucket.Arn}/image/*'

  GetFollowersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowersLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt FollowsTable.Arn
                - !Sub '${FollowsTable.Arn}/index/FollowersIndex'
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn

  GetFolloweesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFolloweesLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt FollowsTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn

  GetFollowerCountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowerCountLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn

  GetFolloweeCountFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFolloweeCountLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn

  GetFollowingStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFollowingStatusLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt FollowsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn

  FollowFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: FollowLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FollowsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt UsersTable.Arn
                - !GetAtt SessionsTable.Arn

  UnfollowFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: UnfollowLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt FollowsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt UsersTable.Arn
                - !GetAtt SessionsTable.Arn

  GetUserFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetUserLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn

  LoginFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: LoginLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SessionsTable.Arn

  RegisterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: RegisterLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SessionsTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub '${ProfileImagesBucket.Arn}/image/*'

  LogoutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: LogoutLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt SessionsTable.Arn

  GetStoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetStoryLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  GetFeedFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: GetFeedLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  PostStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: PostStatusLambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10

  TweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      OpenApiVersion: '2.0'
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'POST,OPTIONS'"
      DefinitionBody:
        swagger: '2.0'
        info:
          title: Tweeter API
          version: '1.0'
        consumes:
          - application/json
        produces:
          - application/json
        # These cover failures generated by API Gateway before Lambda responds.
        x-amazon-apigateway-gateway-responses:
          DEFAULT_4XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          DEFAULT_5XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        paths:
          /followers/list:
            post:
              summary: Get a page of followers
              description: Authenticates the session, queries persisted followers, and returns their public profiles using the optional last-user cursor.
              responses:
                '200':
                  description: A page of user DTOs and a hasMore flag.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: Invalid request fields or a user alias that does not exist.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '401':
                  description: The token is malformed, expired, unknown, or revoked.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                # "aws" selects a custom (non-proxy) Lambda integration.
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowersFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      # Standard Lambda errors contain errorMessage; successful page responses do not.
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  # Match validation errors from GetFollowersLambda.
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  '(?s)^\[Unauthorized\].*':
                    statusCode: '401'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  # Exclude expected 400/401 errors from the generic 500 mapping.
                  '(?s)^(?!\[(?:Bad Request|Unauthorized)\]).+':
                    statusCode: '500'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": "An unexpected server error occurred."}
          /followees/list:
            post:
              summary: Get a page of followees
              description: Authenticates the session, queries persisted followees, and returns their public profiles using the optional last-user cursor.
              responses:
                '200':
                  description: A page of user DTOs and a hasMore flag.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: Invalid request fields or a user alias that does not exist.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '401':
                  description: The token is malformed, expired, unknown, or revoked.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweesFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  '(?s)^\[Unauthorized\].*':
                    statusCode: '401'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  # Exclude expected 400/401 errors from the generic 500 mapping.
                  '(?s)^(?!\[(?:Bad Request|Unauthorized)\]).+':
                    statusCode: '500'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": "An unexpected server error occurred."}

          /followers/count:
            post:
              summary: Get a user's follower count
              description: Authenticates the session and returns the persisted follower count for the requested user.
              responses:
                '200':
                  description: A success flag and follower count.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The request is malformed or the requested user does not exist.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '401':
                  description: The token is malformed, expired, unknown, or revoked.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowerCountFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  '(?s)^\[Unauthorized\].*':
                    statusCode: '401'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  # Exclude expected 400/401 errors from the generic 500 mapping.
                  '(?s)^(?!\[(?:Bad Request|Unauthorized)\]).+':
                    statusCode: '500'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": "An unexpected server error occurred."}

          /followees/count:
            post:
              summary: Get a user's followee count
              description: Authenticates the session and returns the persisted followee count for the requested user.
              responses:
                '200':
                  description: A success flag and followee count.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The request is malformed or the requested user does not exist.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '401':
                  description: The token is malformed, expired, unknown, or revoked.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFolloweeCountFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  '(?s)^\[Unauthorized\].*':
                    statusCode: '401'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  # Exclude expected 400/401 errors from the generic 500 mapping.
                  '(?s)^(?!\[(?:Bad Request|Unauthorized)\]).+':
                    statusCode: '500'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": "An unexpected server error occurred."}

          /follow/status:
            post:
              summary: Check whether one user follows another
              description: Authenticates the session and checks the persisted relationship in the supplied follower-to-followee direction.
              responses:
                '200':
                  description: A success flag and boolean isFollower result.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: The token or either user alias is missing or malformed.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '401':
                  description: The token is malformed, expired, unknown, or revoked.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetFollowingStatusFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  '(?s)^\[Unauthorized\].*':
                    statusCode: '401'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": $input.json('$.errorMessage')}
                  # Exclude expected 400/401 errors from the generic 500 mapping.
                  '(?s)^(?!\[(?:Bad Request|Unauthorized)\]).+':
                    statusCode: '500'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        {"errorMessage": "An unexpected server error occurred."}

          /follow:
            post:
              summary: Follow a user
              description: Authenticates the session owner, creates the relationship to the target user, and updates both follow counts atomically.
              responses:
                '200':
                  description: A success flag and optional message after the relationship transaction completes.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '400':
                  description: Invalid request fields, a missing account, or an attempt to follow oneself.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '401':
                  description: The token is malformed, expired, unknown, or revoked.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                '500':
                  description: An unexpected server error occurred.
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FollowFunction.Arn}/invocations
                passthroughBehavior: never
                requestTemplates:
                  application/json: '$input.json("$")'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: |
                        #set($result = $input.path('$'))
                        #if($result.containsKey("errorMessage"))
                        #set($context.responseOverride.status = 500)
                        {"errorMessage": "An unexpected server error occurred."}
                        #else
                        $input.json("$")
                        #end
                  '(?s)^\[Bad Request\].*':
                    statusCode: '400'
